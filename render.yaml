services:
  - type: web
    name: fund-assistant
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    disk:
      name: fund-data
      mountPath: /opt/render/project/src
      sizeGB: 1
